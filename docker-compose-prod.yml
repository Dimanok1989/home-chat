services:
  app-prod:
    build:
      context: .
      dockerfile: docker/php/prod/Dockerfile
    container_name: homechat-app-prod
    restart: unless-stopped
    working_dir: /var/www
    volumes:
      - .:/var/www
    environment:
      - APP_ENV=production
      - APP_DEBUG=false
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      # Host user for npm/composer writes into the bind mount (public/build, etc.)
      # so assets can be rebuilt on the host without chown / docker restart.
      # Override in .env if your uid/gid is not 1000: HOST_UID=1000 HOST_GID=1000
      - HOST_UID=${HOST_UID:-1000}
      - HOST_GID=${HOST_GID:-1000}
    depends_on:
      - redis
    networks:
      - homechat

  nginx-prod:
    build:
      context: .
      dockerfile: docker/nginx/Dockerfile
    container_name: homechat-nginx-prod
    restart: unless-stopped
    ports:
      - "${DOCKER_NGINX_PORT:-8080}:80"
    volumes:
      - ./public:/var/www/public
      - ./docker/nginx/prod/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app-prod
    networks:
      - homechat

  redis:
    build:
      context: .
      dockerfile: docker/redis/Dockerfile
    container_name: homechat-redis-prod
    restart: unless-stopped
    networks:
      - homechat

  queue-prod:
    build:
      context: .
      dockerfile: docker/php/prod/Dockerfile
    container_name: homechat-queue-prod
    restart: unless-stopped
    working_dir: /var/www
    entrypoint: ["php", "artisan", "queue:work", "--sleep=1", "--tries=3", "--timeout=30"]
    volumes:
      - .:/var/www
    environment:
      - APP_ENV=production
      - APP_DEBUG=false
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    depends_on:
      - redis
      - app-prod
    networks:
      - homechat

  echo:
    build:
      context: .
      dockerfile: docker/echo/Dockerfile
    container_name: homechat-echo
    restart: unless-stopped
    ports:
      - "${DOCKER_WS_PORT:-6001}:6001"
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_KEY_PREFIX=${REDIS_PREFIX:-laravel-database-}
      - ECHO_AUTH_HOST=${ECHO_AUTH_HOST:-http://nginx-prod}
      - ECHO_CORS_ORIGIN=${ECHO_CORS_ORIGIN:-https://chat.kolgaev.ru}
    depends_on:
      - redis
      - nginx-prod
    networks:
      - homechat

networks:
  homechat:
    driver: bridge
