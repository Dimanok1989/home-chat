services:
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: homechat-app
    working_dir: /var/www
    volumes:
      - .:/var/www
    environment:
      - APP_ENV=development
      - APP_DEBUG=true
    ports:
      - "5173:5173"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - homechat

  nginx:
    build:
      context: .
      dockerfile: docker/nginx/Dockerfile
    container_name: homechat-nginx
    ports:
      - "8080:80"
    volumes:
      - ./public:/var/www/public
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app
    networks:
      - homechat

  mysql:
    build:
      context: .
      dockerfile: docker/mysql/Dockerfile
    container_name: homechat-mysql
    environment:
      MYSQL_DATABASE: homechat
      MYSQL_USER: homechat
      MYSQL_PASSWORD: homechat_secret
      MYSQL_ROOT_PASSWORD: root_secret
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot_secret"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - homechat

  redis:
    build:
      context: .
      dockerfile: docker/redis/Dockerfile
    container_name: homechat-redis
    ports:
      - "6380:6379"
    volumes:
      - redis_data:/data
    networks:
      - homechat

  echo:
    build:
      context: .
      dockerfile: docker/echo/Dockerfile
    container_name: homechat-echo
    ports:
      - "6001:6001"
    depends_on:
      - redis
      - app
    networks:
      - homechat

  adminer:
    build:
      context: .
      dockerfile: ./docker/adminer/Dockerfile
    container_name: homechat-adminer
    ports:
      - "8081:8080"
    depends_on:
      - mysql
    networks:
      - homechat

volumes:
  mysql_data:
  redis_data:

networks:
  homechat:
    driver: bridge